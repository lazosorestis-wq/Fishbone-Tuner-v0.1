
name: Build Fishbone Tuner APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=== APK INFORMATION ==="
          ls -lh "$APK"

          echo "=== APK PACKAGE ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 15

          echo "=== APK SIGNATURE ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

          
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test APK installation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.fishbone.tuner
            adb shell am start -n com.fishbone.tuner/.MainActivity
            sleep 3
            adb shell pidof com.fishbone.tuner



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fishbone-Tuner-APK
          path: app/build/outputs/apk/debug/*.apk
